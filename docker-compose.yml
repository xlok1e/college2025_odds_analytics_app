version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: my_app_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: myappdb
      POSTGRES_USER: myappuser
      POSTGRES_PASSWORD: myapppass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/scripts/create_tables.sql:/docker-entrypoint-initdb.d/01_create_tables.sql
      - ./database/scripts/insert_mock_data.sql:/docker-entrypoint-initdb.d/02_insert_mock_data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myappuser -d myappdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
